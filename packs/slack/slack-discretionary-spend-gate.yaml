# Slack Discretionary-Spend Gate
#
# Every spend approval ping above $5k carries the policy snapshot, the requester's authority, and a public verify URL.
#
# Audience:  Ops and finance teams releasing discretionary spend from Slack
# Platform:  slack
# Vertical:  fintech
# Standards: SOC 2 CC8.1, ISO 27001 A.5.15, Spend approval evidence
# Install:   3 min — Open the Slack app home
# Rendered:  https://decionis.com/policy-exchange/slack-discretionary-spend-gate
#
# Rules in this pack:
#   - Spend threshold: Escalates a discretionary spend release above $5,000 to the named approver.
#   - Self-approval block: Blocks a release where requester and approver are the same person.
#   - Budget-headroom check: Restrains a release that would take the cost centre past its remaining budget.
# Fork: set the threshold and cost-centre budget source for your org.
apiVersion: decionis.dev/v1
kind: PolicyPack
metadata:
  name: slack-discretionary-spend-gate
  surface: slack
  workflow_key: discretionary_spend_release
  standards: [SOC2-CC8.1, ISO27001-A.5.15]
defaults:
  mode: shadow
  emit_dossier: true
rules:
  - name: spend_threshold
    when: "action == 'spend.release'"
    decision: |
      ALLOW IF amount_usd < 5000
      ESCALATE OTHERWISE
    reason_code: spend_over_approval_threshold
  - name: self_approval_block
    when: "action == 'spend.release'"
    decision: |
      BLOCK IF approver.email == requester.email
      ALLOW OTHERWISE
    reason_code: self_approval_not_permitted
  - name: budget_headroom_check
    when: "action == 'spend.release'"
    decision: |
      RESTRAIN IF amount_usd > cost_centre.remaining_budget_usd
      ALLOW OTHERWISE
    reason_code: exceeds_cost_centre_budget
