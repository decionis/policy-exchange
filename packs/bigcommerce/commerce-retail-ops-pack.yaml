# Commerce & Retail Ops Pack
#
# Over-selling, margin-floor, and coupon-stacking gates for orders and fulfillment — the three that leak the most money.
#
# Audience:  Shopify Plus, BigCommerce, high-volume retail
# Platform:  bigcommerce
# Vertical:  commerce
# Standards: SOC 2 CC8.1, ISO 27001 A.8.34, Checkout evidence trail
# Install:   4 min — See the BigCommerce install guide
# Rendered:  https://decionis.com/policy-exchange/commerce-retail-ops-pack
#
# Rules in this pack:
#   - Over-Selling Gate: Blocks fulfilling an order for stock oversold across channels.
#   - Margin Floor Guard: Blocks any order that would breach the encoded margin floor.
#   - Coupon-Stacking Gate: Stops unauthorized or cascading discount stacking at checkout.
# Fork: the three gates from the commerce starter pack, with your thresholds.
apiVersion: decionis.dev/v1
kind: PolicyPack
metadata:
  name: commerce-retail-ops-pack
  surface: bigcommerce
  policy_pack_id: commerce
  standards: [SOC2-CC8.1, ISO27001-A.8.34]
defaults:
  mode: shadow
  emit_dossier: true
margin_floor_pct: 12
rules:
  - name: over_selling_gate
    when: "action == 'order.fulfill'"
    decision: |
      BLOCK IF units_ordered > units_available
      ALLOW OTHERWISE
    reason_code: oversold_inventory
  - name: margin_floor_guard
    when: "action == 'checkout.commit'"
    decision: |
      BLOCK IF order.net_margin_pct < margin_floor_pct
      ALLOW OTHERWISE
    reason_code: below_margin_floor
  - name: coupon_stacking_gate
    when: "action == 'checkout.apply_discount'"
    decision: |
      BLOCK IF combined_discount_pct >= 50
      ESCALATE IF coupons.count > 1
      ALLOW OTHERWISE
    reason_code: unauthorized_coupon_stacking
