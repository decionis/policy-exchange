# LangGraph Plan → Execute Gate
#
# Drop a gate node between plan and execute so the graph's conditional edge branches on the verdict instead of a guess.
#
# Audience:  JS / Node agent builders running multi-step LangGraph workflows
# Platform:  langchain
# Vertical:  ai_agency
# Standards: SOC 2 CC7.2, ISO 27001 A.8.9, Agent action evidence
# Install:   4 min — Install @decionis/langchain
# Rendered:  https://decionis.com/policy-exchange/langgraph-plan-execute-gate
#
# Rules in this pack:
#   - Step blast-radius gate: Escalates a planned step whose blast radius exceeds the encoded ceiling.
#   - Out-of-scope step block: Blocks a step that falls outside the agent's declared scope.
#   - Human-in-the-loop hold: Escalates when the plan itself flags that a human approval is required.
# Fork: place decionisGateNode between plan and execute; the conditional edge
# branches on state.decionis.outcome (allowed / blocked / errored).
apiVersion: decionis.dev/v1
kind: PolicyPack
metadata:
  name: langgraph-plan-execute-gate
  surface: langchain
  workflow_key: agent_plan_execution
  standards: [SOC2-CC7.2, ISO27001-A.8.9]
defaults:
  mode: shadow
  emit_dossier: true
rules:
  - name: step_blast_radius_gate
    when: "node == 'execute'"
    decision: |
      ALLOW IF step.risk_score < 60
      ESCALATE IF step.risk_score < 85
      BLOCK OTHERWISE
    reason_code: step_risk_over_threshold
  - name: out_of_scope_step_block
    when: "node == 'execute'"
    decision: |
      BLOCK IF outside_scope == true
      ALLOW OTHERWISE
    reason_code: step_outside_agent_scope
  - name: human_in_the_loop_hold
    when: "node == 'execute'"
    decision: |
      ESCALATE IF requires_human == true
      ALLOW OTHERWISE
    reason_code: plan_requires_human_approval
